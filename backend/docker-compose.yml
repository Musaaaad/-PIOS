services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pios
      POSTGRES_USER: pios
      POSTGRES_PASSWORD: pios
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pios -d pios"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pios_pgdata:/var/lib/postgresql/data
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pios
      MINIO_ROOT_PASSWORD: pios-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pios_minio:/data
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 pios pios-secret; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/pios-evidence;
      /usr/bin/mc anonymous set none local/pios-evidence;
      exit 0;"
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
volumes:
  pios_pgdata:
  pios_minio:
