# Render Blueprint for the PIOS full stack.
#
# Creates a managed PostgreSQL 16 database, the FastAPI backend (from the
# existing backend/Dockerfile), and the static frontend. Applying this in
# Render is a one-time action performed by an account owner; thereafter
# .github/workflows/deploy-production.yml redeploys on every push to main.
#
# Free-plan caveat worth knowing before you rely on this: Render free web
# services are suspended after inactivity and cold-start on the next request,
# and free PostgreSQL instances expire after 30 days. For anything beyond a
# demonstration, move both to a paid plan.
#
# No secret values appear in this file. Database credentials are injected by
# Render from the managed instance; everything else is either non-sensitive or
# marked sync:false so it must be set in the Render dashboard.

databases:
  - name: pios-db
    databaseName: pios
    user: pios
    plan: free
    # MUST match the region of pios-api below. Render's internal connection
    # string only resolves within a region, so a Frankfurt service cannot reach
    # an Oregon database - and omitting this key silently defaults to Oregon.
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []          # private network only; no public database access

services:
  # --------------------------------------------------------------- identity --
  # Keycloak, built from deploy/keycloak/Dockerfile with the pios realm baked
  # in. It shares pios-db under a dedicated `keycloak` schema, which pios-api
  # creates on boot - so pios-api must have started successfully at least once
  # before Keycloak can complete its first start. Render restarts a failed
  # service, so this resolves itself; it is not a manual step. The realm defines the nine PIOS role codes and the public `pios-portal`
  # client restricted to Authorization Code + PKCE (S256) - no client secret
  # exists, which is why none can leak into the frontend bundle.
  - type: web
    name: pios-keycloak
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./deploy/keycloak/Dockerfile
    dockerContext: ./deploy/keycloak
    # Reachable only because deploy/keycloak/Dockerfile sets
    # KC_LEGACY_OBSERVABILITY_INTERFACE=true. Keycloak 25 serves /health on a
    # separate management interface (port 9000) by default, and Render routes
    # only the single port the app binds - so without that flag this path 404s
    # and the service never passes its health check. Kept in step by
    # backend/tests/test_keycloak_deployment_config.py.
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      # Render's free tier permits only ONE PostgreSQL instance per account, so
      # Keycloak shares pios-db rather than provisioning a second one.
      - key: DATABASE_URL
        fromDatabase:
          name: pios-db
          property: connectionString
      # Isolation is by schema, not by database. Keycloak creates roughly 95
      # tables; left in `public` they would sit alongside the 92 PIOS tables and
      # break both the emptiness check and the 92/1305/72/203/374 catalog
      # verification in backend/scripts/bootstrap_db.py, which are scoped to
      # `public`. The schema is created by that same bootstrap.
      - key: KC_DB_SCHEMA
        value: keycloak
      - key: KEYCLOAK_ADMIN
        value: pios-admin
      # Generated by Render and never stored in this repository.
      - key: KEYCLOAK_ADMIN_PASSWORD
        generateValue: true
      - key: KC_HOSTNAME
        sync: false

  # ---------------------------------------------------------------- backend --
  - type: web
    name: pios-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: ./scripts/render_entrypoint.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PIOS_DATABASE_URL
        fromDatabase:
          name: pios-db
          property: connectionString
      - key: PIOS_ENV
        value: production
      # Production posture: OIDC only, development tokens refused outright.
      # app/core/security.py additionally hard-blocks dev tokens whenever
      # PIOS_ENV=production, so this is defence in depth rather than the only
      # control.
      - key: PIOS_AUTH_MODE
        value: oidc
      - key: PIOS_ALLOW_DEV_TOKENS
        value: "false"
      - key: PIOS_LOG_LEVEL
        value: INFO
      - key: PIOS_RELEASE_VERSION
        value: 1.4.0
      - key: PIOS_TLS_ENABLED
        value: "true"
      - key: PIOS_OBJECT_STORAGE_BACKEND
        value: local
      - key: PIOS_OBJECT_STORAGE_ROOT
        value: /app/var/evidence
      - key: PIOS_EXPORT_STORAGE_ROOT
        value: /app/var/exports
      # Restrict browser access to the deployed frontend origin. Set this in
      # the Render dashboard once the frontend URL is known.
      - key: PIOS_CORS_ORIGINS
        sync: false
      # Institutional OIDC. Left unset here on purpose: these must be supplied
      # by whoever owns the identity provider, never committed to the repo.
      # Until they are set the API will reject all authentication, which is the
      # correct failure mode for a production deployment.
      # Resolved from the Keycloak service above. The realm is named `pios`,
      # so the issuer is <keycloak-url>/realms/pios and JWKS is discoverable at
      # the standard path beneath it. Audience matches the pios-api-audience
      # mapper in deploy/keycloak/pios-realm.json.
      - key: PIOS_OIDC_ISSUER
        sync: false
      - key: PIOS_OIDC_AUDIENCE
        value: pios-api
      - key: PIOS_OIDC_JWKS_URL
        sync: false

  # --------------------------------------------------------------- frontend --
  # Optional. The primary frontend is already live on GitHub Pages
  # (https://musaaaad.github.io/-PIOS/) via .github/workflows/deploy-pages.yml.
  # This service is kept as a same-origin alternative that avoids cross-origin
  # calls entirely; delete it from this blueprint if you only want Pages.
  # Note: Render static sites take no `plan` key - they are always free, and
  # supplying one fails blueprint validation.
  - type: web
    name: pios-frontend
    runtime: static
    branch: main
    # A committed, locally tested script rather than an inline command: an
    # inline multi-line heredoc is folded by YAML into an escaped one-line
    # scalar, which is fragile and cannot be tested outside Render.
    buildCommand: bash deploy/render/build_frontend.sh
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      # Deliberately a plain empty default rather than `sync: false`. A
      # sync:false variable makes Render prompt for a value while applying the
      # blueprint, and an apply that is clicked through without supplying one
      # can leave this service unprovisioned. With an empty default the site
      # always provisions, serving demo mode, and the real API URL is set
      # afterwards in the dashboard - at which point Render redeploys it.
      #
      # Set to the pios-api URL once it exists, e.g.
      #   https://pios-api.onrender.com/api/v1
      - key: PIOS_API_BASE_URL
        value: ""
      # Empty means "derive from PIOS_API_BASE_URL": demo when unset, live when
      # set. Override to "true" to force demo mode even against a live API.
      - key: PIOS_DEMO_MODE
        value: ""
      # Baked into config.js at build time. Public values only - a public OIDC
      # client has no secret by design.
      - key: PIOS_OIDC_ISSUER
        sync: false
      - key: PIOS_OIDC_CLIENT_ID
        value: pios-portal
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'self'; form-action 'none'"
