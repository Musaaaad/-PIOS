name: pios-integration-v17
services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: pios
      POSTGRES_USER: pios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pios-integration-only}
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pios -d pios"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - pios_v17_pg:/var/lib/postgresql/data
      - ../PIOS_MVP_PostgreSQL_Schema_v1.4.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ../PIOS_MVP_PostgreSQL_Seed_v1.4.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-piosintegration}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pios-integration-secret-change-me}
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes: ["pios_v17_minio:/data"]
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -ec '
      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
      mc mb --ignore-existing local/pios-evidence;
      mc anonymous set none local/pios-evidence;
      mc version enable local/pios-evidence;
      '
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-piosintegration}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pios-integration-secret-change-me}
volumes:
  pios_v17_pg:
  pios_v17_minio:
