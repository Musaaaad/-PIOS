services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pios
      POSTGRES_USER: pios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pios-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pios -d pios"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: [pios_pgdata:/var/lib/postgresql/data]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pios}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pios-secret-change-me}
    volumes: [pios_minio:/data]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-pios} $${MINIO_ROOT_PASSWORD:-pios-secret-change-me}; do sleep 2; done;
      mc mb --ignore-existing local/pios-evidence; mc anonymous set none local/pios-evidence;"

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-change-me}
    volumes: [pios_keycloak_pgdata:/var/lib/postgresql/data]
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-change-me}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-change-me}
    depends_on: [keycloak-db]
    ports: ["8081:8080"]
    volumes: [./deploy/keycloak/pios-realm.json:/opt/keycloak/data/import/pios-realm.json:ro]
  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      db: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    volumes: [pios_exports:/app/var/exports]
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      api: {condition: service_healthy}
  acceptance-runner:
    build: ./backend
    env_file: .env
    profiles: ["acceptance"]
    depends_on:
      api: {condition: service_healthy}
    command: ["python", "scripts/sprint6_deployment_acceptance_smoke.py"]
    volumes:
      - ./backend/reports:/app/reports
      - pios_deployment_reports:/app/var/deployment-reports

  committee-governance-smoke:
    build: ./backend
    env_file: .env
    profiles: ["smoke"]
    command: ["python", "scripts/sprint12_committee_governance_smoke.py"]
    volumes:
      - ./backend/reports:/app/reports

  scheduler:
    build: ./backend
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    command: ["/bin/sh","-c","while true; do python scripts/refresh_notifications_job.py; python scripts/cleanup_exports.py; sleep 900; done"]
    volumes: [pios_exports:/app/var/exports]
volumes:
  pios_pgdata:
  pios_minio:
  pios_exports:
  pios_keycloak_pgdata:
  pios_deployment_reports:
