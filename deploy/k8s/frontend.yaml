apiVersion: apps/v1
kind: Deployment
metadata: {name: pios-frontend, namespace: pios}
spec:
  replicas: 2
  selector: {matchLabels: {app: pios-frontend}}
  template:
    metadata: {labels: {app: pios-frontend}}
    spec:
      containers:
        - name: frontend
          image: registry.example.sa/pios/frontend:0.1.0
          ports: [{containerPort: 80}]
          readinessProbe: {httpGet: {path: /health, port: 80}, initialDelaySeconds: 5, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: pios-frontend, namespace: pios}
spec: {selector: {app: pios-frontend}, ports: [{port: 80, targetPort: 80}]}
