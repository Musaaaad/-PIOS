name: PIOS CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e './backend[dev]'
      - run: cd backend && pytest -q && python -m compileall -q app scripts migrations
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: cd frontend && ./tests/js_syntax_check.sh
      # Runtime UI tests. These build the real artifact via
      # deploy/render/build_frontend.sh and drive it in jsdom, so they cover
      # what Render and Pages actually publish rather than source alone.
      - run: cd frontend && npm ci
      - run: cd frontend && npm test
      - run: docker compose build api frontend
